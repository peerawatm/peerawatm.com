<script>
(function(){
  var saved = null;
  try{ saved = localStorage.getItem("theme"); }catch(e){}
  var explicit = saved === "dark" || saved === "light" ? saved : null;
  var dark = explicit === "dark";
  if (!explicit){
    try{ dark = window.matchMedia("(prefers-color-scheme: dark)").matches; }catch(e){}
  }
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  var meta = document.getElementById("theme-color");
  if (meta) meta.content = dark ? "#000000" : "#ffffff";
})();
</script>
<style>
@font-face{
  font-family:"Nunito";
  font-style:normal;
  font-weight:200 1000;
  font-display:swap;
  src:url("/fonts/nunito-var-20fc9b6f.woff2") format("woff2");
}
:root{
  color-scheme: light;
  --bg:#ffffff; --ink:#000000; --placeholder:#e5e5e5;
  --accent:#000000;
  --frame:3px; --radius:1rem;
  --space-1:.25rem; --space-2:.5rem; --space-3:1rem; --space-4:1.5rem;
  --space-5:2rem; --space-6:3rem; --space-8:4rem;
  --card-w:min(100%,20rem);                              /* featured card and social row share one width */
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#000000; --ink:#ffffff; --placeholder:#292929;
  --accent:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    color-scheme: dark;
    --bg:#000000; --ink:#ffffff; --placeholder:#292929;
    --accent:#ffffff;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 Nunito,ui-rounded,-apple-system,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
header{
  max-width:74rem;margin:0 auto;padding:var(--space-8) var(--space-4);text-align:left;
}
h1{
  width:fit-content;margin:0 auto;
  font-size:clamp(2.5rem,9vw,5rem);font-weight:800;
  letter-spacing:-.02em;line-height:.8;                 /* lines overlap a little vertically */
  white-space:nowrap;                                   /* each line is one word; never wrap */
}
h1>span{display:block}
h1>span:last-child{padding-left:2.63em}                 /* measured (wght 800): "M" sits directly under the "w" of "Peerawat" */
/* The capital M is an upside-down "w": the real M stays in the DOM (transparent) for
   screen readers and SEO, and a vertically flipped, cap-height "w" is drawn over it.
   translateY + scaleY are computed from the Nunito glyph boxes at wght 800. */
h1 .m{position:relative;display:inline-block;color:transparent}
h1 .m::before{
  content:"w";position:absolute;left:0;top:0;color:var(--ink);
  transform:translateY(.087em) scaleY(-1.422);
  pointer-events:none;      /* let selection start on the real (transparent) M text under it */
}
@media (forced-colors:active){
  h1 .m{color:inherit}
  h1 .m::before{display:none}
}
@media (max-width:37.5rem){
  header{padding-top:2.5rem;padding-bottom:2rem}
  h1{font-size:min(5rem,calc((100vw - 3rem)/7.5))}
  main{padding-top:1.5rem}
}
.theme{display:inline-flex;gap:.4rem;align-items:center}
.theme button{
  font:inherit;color:var(--ink);background:transparent;line-height:0;
  border:0;padding:0;width:2.5rem;aspect-ratio:1/1;cursor:pointer;
  border-radius:.7rem;
  display:inline-flex;align-items:center;justify-content:center;
  transition:background .375s ease-out,color .375s ease-out,box-shadow .375s ease-out;
}
.theme button:hover{box-shadow:inset 0 0 0 var(--frame) var(--ink);transition-duration:.15s}
.theme button svg{width:1.5rem;height:1.5rem;display:block}
#theme-toggle{display:grid;place-items:center}
#theme-toggle svg{grid-area:1/1;transform-origin:center;transition:opacity .25s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
#theme-toggle .sun{opacity:1;transform:rotate(0) scale(1)}
#theme-toggle .moon{opacity:0;transform:rotate(-90deg) scale(.6)}
:root[data-theme="dark"] #theme-toggle .sun{opacity:0;transform:rotate(90deg) scale(.6)}
:root[data-theme="dark"] #theme-toggle .moon{opacity:1;transform:rotate(0) scale(1)}
@media (prefers-reduced-motion: reduce){
  #theme-toggle svg,.soc svg,.work-placeholder{transition:none}
}
main{max-width:74rem;margin:0 auto;padding:var(--space-5) var(--space-4) var(--space-8)}
.works-heading{text-align:center;margin:0 0 var(--space-4);font-size:clamp(1.75rem,4vw,2rem);font-weight:800}
.works-grid{display:flex;justify-content:center}
.work-card{display:block;width:var(--card-w);color:inherit;text-align:center;text-decoration:none}
.work-placeholder{display:block;aspect-ratio:3/4;overflow:hidden;border-radius:var(--radius);background:var(--placeholder);transition:transform .3s ease}
.work-placeholder img{display:block;width:100%;height:100%;object-fit:cover}
.work-card:hover .work-placeholder{transform:translateY(-3px)}
.work-title{display:block;margin-top:var(--space-3);font-size:1.5rem;font-weight:700;line-height:1.2}
.work-action{display:inline-block;margin-top:var(--space-1);font-size:1rem;font-weight:700;line-height:1.25;opacity:.72}
.work-card:hover .work-action{text-decoration:underline;opacity:1}
.work-card:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:var(--radius)}
footer{max-width:74rem;margin:0 auto;padding:0 var(--space-4) var(--space-6);color:var(--ink);
  font-size:1.5rem;text-align:left}
footer .socials{
  /* Row matches the featured card; leftover space becomes gap automatically. */
  --soc-gap:var(--space-2);
  display:flex;justify-content:space-between;align-items:center;gap:var(--soc-gap);
  width:var(--card-w);margin:0 auto var(--space-6);
}
footer .soc{color:inherit;text-decoration:none;display:inline-flex;flex:1 1 0;min-width:0;max-width:3.6rem}
footer .soc svg{
  width:100%;height:auto;aspect-ratio:1/1;display:block;
  transition:transform .75s ease-out;                       /* out: 2.5x the in */
}
footer .soc:hover svg{transition-duration:.30s;
  transition-timing-function:cubic-bezier(.34,1.2,.55,1)}   /* in: punchy */
footer .copy{font-size:.972em;line-height:1;vertical-align:.01em}
footer .name{font-weight:700}
footer .name a{color:inherit;text-decoration:none}
footer .name a:hover{text-decoration:underline}
footer .base{
  /* One row at every width: copyright left, theme control pinned right. */
  display:flex;justify-content:space-between;align-items:center;
  gap:var(--space-2);flex-wrap:nowrap;
}
footer .theme{flex:0 0 auto;margin-left:auto}

<script>
function unitVector(e, el){
  const r = el.getBoundingClientRect();
  const x = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1);
  const y = Math.min(Math.max((e.clientY - r.top) / r.height, 0), 1);
  let dx = (x - 0.5) * 2, dy = (y - 0.5) * 2;
  const len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }
  return [dx, dy];
}

// Recenter each brand mark inside its square 1:1 frame: tighten the viewBox
// to the glyph's own bounds so the mark sits optically centered. The frame
// itself is square (CSS), so glyphs keep their natural aspect ratio inside it.
document.querySelectorAll(".soc svg").forEach((s) => {
  try {
    const b = s.getBBox();
    if (!b.width || !b.height) return;
    s.setAttribute("viewBox", `${b.x} ${b.y} ${b.width} ${b.height}`);
    s.removeAttribute("width");
    s.removeAttribute("height");
  } catch (e) {}
});

// Lean each social glyph toward the cursor using a clamped pointer vector.
const LEAN = 4;        // px, max travel at the icon edge
const LEAN_CURVE = 2.2; // higher = calmer near the centre (ease-in response)
const leanResp = (v) => Math.sign(v) * Math.pow(Math.abs(v), LEAN_CURVE);
let reduceMotion = false;
try{ reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
if (!reduceMotion) document.querySelectorAll(".soc").forEach((a) => {
  const svg = a.querySelector("svg");
  if (!svg) return;
  a.addEventListener("pointermove", (e) => {
    const [dx, dy] = unitVector(e, a);
    svg.style.transform = `translate(${leanResp(dx) * LEAN}px, ${leanResp(dy) * LEAN}px)`;
  });
  a.addEventListener("pointerleave", () => { svg.style.transform = ""; });
});
</script>
<script>
(() => {
  var host = location.hostname;
  if (host === "localhost" || host === "127.0.0.1") return;
  var started = performance.now();
  var sent = false;
  var cid = "";
  try {
    cid = localStorage.getItem("cid") || "";
    if (!cid) {
      cid = (crypto.randomUUID && crypto.randomUUID()) || Date.now() + Math.random().toString(16).slice(2);
      localStorage.setItem("cid", cid);
    }
  } catch (e) {}
  function send() {
    if (sent) return;
    sent = true;
    var marker = new URLSearchParams(location.search).has("me") ? "?me=1" : "";
    var body = JSON.stringify({
      p: location.pathname,
      r: document.referrer,
      tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
      w: innerWidth,
      h: innerHeight,
      wd: navigator.webdriver === true,
      ms: Math.round(performance.now() - started),
      cid: cid
    });
    var url = "/hit" + marker;
    var blob = new Blob([body], { type: "application/json" });
    try {
      if (navigator.sendBeacon && navigator.sendBeacon(url, blob)) return;
    } catch (e) {}
    try {
      fetch(url, { method: "POST", body: blob, keepalive: true, credentials: "same-origin" }).catch(function(){});
    } catch (e) {}
  }
  setTimeout(send, 15000);
  addEventListener("pagehide", send, { once: true });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") send();
  });
})();
</script>
