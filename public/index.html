<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peerawat Monviset</title>

<link rel="preload" href="/fonts/nunito-var.woff2" as="font" type="font/woff2" crossorigin>
<script>
try{
  var t = localStorage.getItem("theme") || "system";
  document.documentElement.dataset.theme = (t === "dark" || t === "light") ? t : "system";
}catch(e){}
</script>
<style>
@font-face{
  font-family:"Nunito";
  font-style:normal;
  font-weight:200 1000;
  font-display:swap;
  src:url("/fonts/nunito-var.woff2") format("woff2");
}
:root{
  color-scheme: light;
  --bg:#ffffff; --card:#ffffff; --ink:#000000;
  --accent:#000000;
  --frame:3px; --canvas:6px; --radius:1rem; --foot-gap:5rem;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#000000; --card:#000000; --ink:#ffffff;
  --accent:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#000000; --card:#000000; --ink:#ffffff;
    --accent:#ffffff;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 Nunito,ui-rounded,-apple-system,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
header{
  max-width:74rem;margin:0 auto;padding:4rem 1.5rem 1.5rem;text-align:left;
}
h1{margin:0;font-size:clamp(1.5rem,3.5vw,2rem);font-weight:700;letter-spacing:-.01em}
.theme{display:inline-flex;gap:.4rem;align-items:center}
.theme button{
  font:inherit;color:var(--ink);background:transparent;line-height:0;
  border:0;padding:0;width:2.5rem;aspect-ratio:1/1;cursor:pointer;
  border-radius:.7rem;
  display:inline-flex;align-items:center;justify-content:center;
  transition:background .375s ease-out,color .375s ease-out,box-shadow .375s ease-out;
}
.theme button:hover{box-shadow:inset 0 0 0 var(--frame) var(--ink);transition-duration:.15s}
.theme button[aria-pressed="true"]{color:var(--card);background:var(--accent);box-shadow:none;pointer-events:none}
main{max-width:74rem;margin:0 auto;padding:1rem 1.5rem var(--foot-gap)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:2rem}
.tile{
  position:relative;aspect-ratio:1/1;border:0;border-radius:var(--radius);
  padding:0;cursor:pointer;background:var(--ink);overflow:hidden;
}
.tile .fill{
  position:absolute;inset:var(--canvas);pointer-events:none;
  border-radius:calc(var(--radius) - var(--canvas));
  transition:transform .40s ease-out;                     /* out: soft settle ~1.3x the in */
}
.tile:hover .fill{
  transition-duration:.30s;
  transition-timing-function:cubic-bezier(.34,1.2,.55,1);  /* in: punchy overshoot */
}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
footer{max-width:74rem;margin:0 auto;padding:0 1.5rem 3rem;color:var(--ink);
  font-size:1.5rem;text-align:left}
footer .socials{display:flex;justify-content:center;align-items:center;gap:clamp(1.875rem,3.75vw,3.125rem);margin-bottom:3rem}
footer .soc{color:inherit;text-decoration:none;display:inline-flex}
footer .soc svg{height:calc(clamp(3rem,7.2vw,3.6rem) * var(--os,1));width:auto;display:block;
  transition:transform .75s ease-out}                       /* out: 2.5x the in */
footer .soc:hover svg{transition-duration:.30s;
  transition-timing-function:cubic-bezier(.34,1.2,.55,1)}   /* in: punchy */
footer .copy{font-size:.972em;line-height:1;vertical-align:.01em}
footer .name{font-weight:700}
footer .base{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
dialog{border:none;padding:0;background:transparent;width:min(92vw,1100px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.stage{aspect-ratio:1/1;background:var(--card);border-radius:var(--radius)}
.bar{display:flex;justify-content:flex-end;margin-top:.7rem}
.bar button{
  font:inherit;color:var(--ink);background:transparent;border:var(--frame) solid var(--ink);
  border-radius:var(--radius);padding:.4rem .9rem;cursor:pointer;
}
.bar button:hover{color:var(--card);background:var(--accent)}
</style>

<dialog id="lb">
  <div class="stage" id="stage"></div>
  <div class="bar">
    <button type="button" id="close">Close</button>
  </div>
</dialog>

<script>
const palette = ["#e8b4b8","#f2d6a2","#c9e4c5","#b8d4e8","#d6c6e1","#f0e0a8"];
const grid = document.getElementById("grid");
const SHIFT = 5; // px; min stroke = --canvas - SHIFT = 1px

function unitVector(e, el){
  const r = el.getBoundingClientRect();
  const x = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1);
  const y = Math.min(Math.max((e.clientY - r.top) / r.height, 0), 1);
  let dx = (x - 0.5) * 2, dy = (y - 0.5) * 2;
  const len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }
  return [dx, dy];
}

palette.forEach((c, i) => {
  const b = document.createElement("button");
  b.className = "tile";
  b.type = "button";
  b.setAttribute("aria-label", "Artwork " + (i + 1));
  const fill = document.createElement("span");
  fill.className = "fill";
  fill.style.background = c;
  b.append(fill);
  b.addEventListener("pointermove", (e) => {
    const [dx, dy] = unitVector(e, b);
    fill.style.transform = `translate(${dx * SHIFT}px, ${dy * SHIFT}px)`;
  });
  b.addEventListener("pointerleave", () => { fill.style.transform = ""; });
  grid.append(b);
});

const lb = document.getElementById("lb");
const stage = document.getElementById("stage");
grid.addEventListener("click", (e) => {
  const t = e.target.closest(".tile");
  if (!t) return;
  stage.style.background = getComputedStyle(t.querySelector(".fill")).backgroundColor;
  lb.showModal();
});
document.getElementById("close").onclick = () => lb.close();
lb.addEventListener("click", (e) => { if (e.target === lb) lb.close(); });

const root = document.documentElement;
const themeBtns = document.querySelectorAll(".theme button");
function applyTheme(t){
  root.dataset.theme = t;
  try{ localStorage.setItem("theme", t); }catch(e){}
  themeBtns.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.set === t)));
}
themeBtns.forEach((b) => b.addEventListener("click", () => applyTheme(b.dataset.set)));
applyTheme(root.dataset.theme || "system");

// Tighten each brand mark's viewBox to its own glyph and drop the fixed
// 18x18 attributes, so every icon fills the same height and takes its own
// width from the glyph's real aspect ratio.
document.querySelectorAll(".soc svg").forEach((s) => {
  try {
    const b = s.getBBox();
    if (!b.width || !b.height) return;
    s.setAttribute("viewBox", `${b.x} ${b.y} ${b.width} ${b.height}`);
    s.removeAttribute("width");
    s.removeAttribute("height");
    s.style.aspectRatio = `${b.width} / ${b.height}`;
  } catch (e) {}
});

// Lean each social glyph toward the cursor, same clamped vector + easing as the tiles.
const LEAN = 4;        // px, max travel at the icon edge
const LEAN_CURVE = 2.2; // higher = calmer near the centre (ease-in response)
const leanResp = (v) => Math.sign(v) * Math.pow(Math.abs(v), LEAN_CURVE);
document.querySelectorAll(".soc").forEach((a) => {
  const svg = a.querySelector("svg");
  if (!svg) return;
  a.addEventListener("pointermove", (e) => {
    const [dx, dy] = unitVector(e, a);
    svg.style.transform = `translate(${leanResp(dx) * LEAN}px, ${leanResp(dy) * LEAN}px)`;
  });
  a.addEventListener("pointerleave", () => { svg.style.transform = ""; });
});
</script>
</body>
